<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Nombres</title>
</head>
<body>

    <h1>Formulario de Nombres</h1>

    <form method="POST">

        <label>Nombre 1:</label>
        <input type="text" name="nombre1" required>

        <br><br>

        <label>Nombre 2:</label>
        <input type="text" name="nombre2" required>

        <br><br>

        <label>Nombre 3:</label>
        <input type="text" name="nombre3" required>

        <br><br>

        <button type="submit">Enviar</button>

    </form>

    {% if nombre_mayor %}
        <h3>El nombre con mayor cantidad de caracteres es: {{ nombre_mayor }}</h3>
        <h3>El nombre tiene: {{ cantidad }} caracteres</h3>
    {% endif %}

    <br>
    <a href="/">Volver al menu</a>

</body>
</html>
